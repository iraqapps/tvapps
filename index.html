<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">TV Apps</title>
    <meta name="description" content="أفخم قناة عراقية لتطبيقات الأندرويد المعدلة والمخصصة للشاشات (Leanback) وتطبيقات الهواتف التي تتطلب تحكم بالماوس/الريموت."/>
    <meta name="keywords" content="تطبيقات اندرويد, تطبيقات شاشات, تطبيقات ماوس, تطبيقات معدلة, Android Apps X, سينمانا, شبكتي, العراق, Leanback"/>
    <meta property="og:title" content="قناة Android Apps X | تطبيقات شاشات وتطبيقات ماوس معدلة"/>
    <meta property="og:description" content="أفخم قناة عراقية لتطبيقات الأندرويد المعدلة والمخصصة للشاشات (Leanback) وتطبيقات الهواتف التي تتطلب تحكم بالماوس/الريموت."/>
    <meta property="og:type" content="website"/>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
    
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="style-apps.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div id="home-page" class="page-section">
        <div class="header">
            <div class="header-content">
                

                <div class="text-content">

                    
                </div>
            </div>
        </div>

        <div class="buttons-container">
            <button onclick="navigateTo('leanback')" class="custom-button">
                <i class="fas fa-tv"></i> 
                <span>تطبيقات مخصصة للشاشات</span>
                <p class="button-desc">تطبيقات مصممة للعمل بالريموت على الشاشات الذكية</p>
            </button>
            <button onclick="navigateTo('mouse-required')" class="custom-button">
                <i class="fas fa-mouse-pointer"></i> 
                <span>تطبيقات الهواتف</span>
                <p class="button-desc">تطبيقات الهواتف التي تعمل على الشاشات لكن تحتاج ماوس لتشغيلها.</p>
            </button>
        </div>
    </div>
    
    <div id="leanback-page" class="page-section" style="display: none;">
        <div class="header">
            <div class="navigate-btn-container">
                <button onclick="navigateTo('home')" class="navigate-btn">الرجوع للصفحة الرئيسية</button>
            </div>

            <h2 class="apps-title">📺 تطبيقات الشاشة  </h2>
        </div>

        <input type="text" id="leanback-search" placeholder="🔍 ابحث عن تطبيق باسمه أو معلومات الدخول..." dir="rtl">
        
        <p id="leanback-loading" class="loading-message" style="display: none;">...جاري تحميل تطبيقات الشاشات</p>

        <div class="container" id="leanback-app-container"></div>
    </div>

    <div id="mouse-required-page" class="page-section" style="display: none;">
        <div class="header">
            <div class="navigate-btn-container">
                <button onclick="navigateTo('home')" class="navigate-btn">الرجوع للصفحة الرئيسية</button>
            </div>

            <h2 class="apps-title">📱 تطبيقات الهاتف (تحكم ماوس)</h2>
        </div>

        <input type="text" id="mouse-required-search" placeholder="🔍 ابحث عن تطبيق باسمه أو معلومات الدخول..." dir="rtl">
        
        <p id="mouse-required-loading" class="loading-message" style="display: none;">...جاري تحميل تطبيقات الماوس</p>
        
        <div class="container" id="mouse-required-app-container"></div>
    </div>

    <script src="appLoader.js"></script>
</body>
</html>
