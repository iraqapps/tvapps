<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقات معدلة</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <!-- رأس الصفحة (بعد التعديل) -->
    <div class="header">
        <!-- زر الانتقال إلى الصفحة التالية - تم نقله ليكون في الأعلى -->
        <div class="navigate-btn-container">
            <a href="index.html" class="navigate-btn">الرجوع للصفحة الرئيسية</a>
        </div>

        <h2 class="apps-title">📺 تطبيقات الشاشة</h2>
       
    </div>

    <!-- حاوية البطاقات -->
    <div class="container" id="app-container">
        <!-- البطاقات ستُضاف هنا تلقائيًا -->
    </div>

    <script>
        async function loadApps() {
            try {
                const response = await fetch('data.json');
                const apps = await response.json();
                const container = document.getElementById('app-container');

                apps.forEach(app => {
                    const card = document.createElement('div');
                    card.classList.add('card');

                    let buttons = `
                        <a href="${app.download1}" class="download-btn" download>${app.button1 || "تحميل 1"}</a>
                    `;

                    if (app.download2) {
                        buttons += `
                            <a href="${app.download2}" class="download-btn" download>${app.button2 || "تحميل 2"}</a>
                        `;
                    }

                    card.innerHTML = `
                        <img src="${app.image}" alt="${app.name}">
                        <h3>${app.name}</h3>
                        ${buttons}
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('حدث خطأ في تحميل التطبيقات:', error);
            }
        }

        loadApps();
    </script>

</body>
</html>
